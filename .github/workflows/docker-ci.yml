name: Docker environment
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COMPOSE_PROJECT_NAME: exam-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare development configuration
        shell: pwsh
        run: ./scripts/dev.ps1 setup
      - name: Build, start and smoke test development stack
        shell: pwsh
        run: ./scripts/dev.ps1 up -NoWatch
      - name: Unit tests, frontend lint/build and SymPy parser in containers
        shell: pwsh
        run: ./scripts/dev.ps1 test
      - name: Save development logs
        if: always()
        run: |
          mkdir -p .artifacts
          docker compose -f docker-compose.yml -f docker-compose.dev.yml ps --all > .artifacts/dev-ps.txt
          docker compose -f docker-compose.yml -f docker-compose.dev.yml logs --no-color --tail=300 > .artifacts/dev-compose.log 2>&1
      - name: Stop development stack
        if: always()
        shell: pwsh
        run: ./scripts/dev.ps1 down
      - name: Build and check static Nginx stack
        run: |
          docker compose up --build --detach --wait --wait-timeout 120
          curl --fail --retry 3 http://127.0.0.1:3000/
          curl --fail http://127.0.0.1:3000/api/health/metrics
          curl --fail http://127.0.0.1:3000/login
      - name: Collect container logs
        if: always()
        run: |
          mkdir -p .artifacts
          docker compose ps --all > .artifacts/compose-ps.txt
          docker compose logs --no-color --tail=300 > .artifacts/compose.log 2>&1
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: docker-logs
          path: .artifacts/
          retention-days: 7
      - name: Clean up this CI project
        if: always()
        run: docker compose down --remove-orphans
