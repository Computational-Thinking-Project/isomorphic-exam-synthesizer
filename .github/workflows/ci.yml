name: CI Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  backend-test:
    name: Backend Lint, TypeCheck & SymPy Smoke Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r backend/requirements.lock

      - name: Backend Linting (Ruff)
        run: |
          ruff check backend/app scripts/blueprint

      - name: Backend Type Check (Mypy)
        run: |
          mypy backend/app --ignore-missing-imports

      - name: Backend Unit, Integration, Security and Blueprint Tests
        run: python -m pytest backend/tests scripts/blueprint/tests -q
        env:
          ENVIRONMENT: test
          SUPABASE_URL: https://mock.supabase.co
          SUPABASE_ANON_KEY: mock-anon-key
          SUPABASE_SERVICE_ROLE_KEY: mock-service-role-key

      - name: SymPy LaTeX Parser Smoke Test (ANTLR Runtime Verification)
        run: |
          python -c "import sympy; from sympy.parsing.latex import parse_latex; res = parse_latex('x^2 + 1'); assert res is not None; print('SymPy LaTeX parser verified:', res)"

  frontend-test:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Frontend Build Verification
        working-directory: ./frontend
        run: npm run build
